name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Roundtrip integration test
        run: python tests/test_roundtrip.py

      - name: Security test
        run: python tests/test_security.py

      - name: Unit tests (pytest)
        run: |
          pip install pytest
          # On lance pytest sur le dossier tests/, et on accepte qu'il
          # ne trouve aucun test compatible (mode tolerant pour ce job)
          pytest tests/ -v --tb=short || echo "pytest a renvoyé un code différent de 0"

      - name: Compile-check all modules
        run: |
          python -m py_compile src/pzsavesync/*.py
